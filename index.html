<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brewery OS — Tanks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Tanks</h1>
    <button id="add-tank" class="btn">+ Add tank</button>
  </header>

  <!-- Tank cards get drawn in here by app.js, grouped by location -->
  <main id="tanks"></main>

  <!-- Batches that have been packaged (no longer in a tank) -->
  <section id="packaged" class="list-section" hidden>
    <h2>Packaged batches</h2>
    <ul id="packaged-list"></ul>
  </section>

  <!-- The beers you make (recipes/products). Batches point at these. -->
  <section id="beers" class="list-section">
    <div class="section-head">
      <h2>Beers</h2>
      <button id="add-beer" class="btn">+ Add beer</button>
    </div>
    <ul id="beer-list"></ul>
  </section>

  <!-- Pop-up form for a batch. Opens when you tap a tank card. -->
  <dialog id="batch-editor">
    <form id="batch-form">
      <h2 id="batch-title">Batch</h2>

      <div class="two-col">
        <label>Batch #
          <input name="batchId" required inputmode="numeric" placeholder="1043">
        </label>
        <label>Size (bbl)
          <input name="sizeBbl" type="number" min="0" step="0.5" placeholder="15">
        </label>
      </div>

      <label>Beer
        <select name="beerId" required></select>
      </label>

      <label>Brew date
        <input name="brewDate" type="date" required>
      </label>

      <label>Tank
        <select name="tankId"></select>
      </label>

      <div class="two-col">
        <label>Stage
          <select name="stage"></select>
        </label>
        <label>Stage started
          <input name="stageStartDate" type="date" required>
        </label>
      </div>

      <div class="actions">
        <button type="button" id="delete-batch" class="btn danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
      <button type="button" id="open-tank-settings" class="link">Tank settings</button>
    </form>
  </dialog>

  <!-- Pop-up form for the tank itself. Tanks rarely change: set them up once. -->
  <dialog id="tank-editor">
    <form id="tank-form">
      <h2 id="tank-title">Tank</h2>

      <div class="two-col">
        <label>Tank name
          <input name="name" required placeholder="FV-5">
        </label>
        <label>Capacity (bbl)
          <input name="capacityBbl" type="number" min="0" step="0.5" placeholder="15">
        </label>
      </div>

      <label>Type
        <select name="type"></select>
      </label>

      <label>Location
        <input name="location" list="location-options" placeholder="Which facility">
        <datalist id="location-options"></datalist>
      </label>

      <!-- Only shown when the tank is empty. A tank with beer in it is "occupied" automatically. -->
      <label id="status-field">Status
        <select name="status">
          <option value="empty">Empty (ready to fill)</option>
          <option value="cleaning">Cleaning</option>
          <option value="maintenance">Maintenance</option>
        </select>
      </label>
      <p id="occupied-note" class="muted"></p>

      <div class="actions">
        <button type="button" id="delete-tank" class="btn danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Pop-up form for a beer: the product itself, not one particular brew of it -->
  <dialog id="beer-editor">
    <form id="beer-form">
      <h2 id="beer-title">Beer</h2>

      <label>Name
        <input name="name" required placeholder="House Hazy">
      </label>

      <label>Style
        <input name="style" list="style-options" placeholder="Hazy IPA">
        <datalist id="style-options"></datalist>
      </label>

      <div class="two-col">
        <label>Target OG
          <input name="targetOg" type="number" min="1" max="1.2" step="0.001" placeholder="1.066">
        </label>
        <label>Target FG
          <input name="targetFg" type="number" min="0.99" max="1.2" step="0.001" placeholder="1.016">
        </label>
      </div>
      <p class="muted">Target ABV: <strong id="target-abv">—</strong> (worked out from OG and FG)</p>

      <div class="actions">
        <button type="button" id="delete-beer" class="btn danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
